name: Daily Instagram + Facebook Post

# Runs entirely in GitHub's cloud — your PC/desktop app does NOT need to be
# open. It reads the already-published, privacy-scrubbed market_data.json.
#
# HOW THIS WORKS NOW (catch-up model, not fixed-time-or-skip):
#   Three posts a day — market overview, sectors overview, evening tickers
#   — each has a Cairo LOCAL due time (see post_state.py: 16:00, 16:20,
#   19:00). A run doesn't just fire at a fixed clock time and give up if
#   data isn't ready; instead, EVERY run (whether triggered by a fresh
#   data push, or the periodic safety-net check below) asks post_state.py
#   "which due posts haven't gone out today yet?" and posts ALL of them,
#   right then — however late that ends up being. Nothing is lost to a
#   late CSV feed; it just posts as soon as the data shows up, and never
#   posts the same slot twice in one day.
#
# TWO TRIGGERS:
#   1. push — fires the moment publish.py pushes new market_data.json,
#      so a same-day feed usually posts within seconds/minutes.
#   2. schedule (every 15 min, 10:00-19:59 UTC, Sun-Thu) — a safety net
#      in case the push trigger is ever missed, and the mechanism that
#      actually catches a LATE feed (e.g. you feed at 6pm — nothing
#      triggers a push-based run again until you next run publish.py,
#      so this periodic check is what notices the already-pushed data
#      and posts the overdue slot(s) without you doing anything).
#   The 10:00-19:59 UTC window comfortably covers all 3 Cairo due times
#   (16:00/16:20/19:00) in both DST offsets (UTC+2 winter / UTC+3 summer).
on:
  push:
    branches: [main]
    paths:
      - 'web_public/data/market_data.json'
  schedule:
    - cron: "*/15 10-19 * * 0-4"
  workflow_dispatch:
    inputs:
      post_type:
        description: "Leave as 'auto' for the normal due/not-yet-posted check, or force one specific type right now regardless of due-time/already-posted state"
        required: true
        default: "auto"
        type: choice
        options: [auto, tickers, market, sectors]

permissions:
  contents: write   # needed to commit rendered PNGs + post_state.json back to the repo

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone — post_state.py's
          # freshness check and this job's `git pull --rebase` both need
          # to see more than just the single latest commit.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pillow

      - name: Determine which post type(s) are due
        id: due
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.post_type }}" != "auto" ]; then
            echo "types=${{ inputs.post_type }}" >> "$GITHUB_OUTPUT"
            echo "Forced manual post: ${{ inputs.post_type }}"
          else
            python post_state.py due
          fi

      - name: Post each due type to Instagram + Facebook
        if: steps.due.outputs.types != ''
        id: publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
        run: |
          set -e
          git config user.name "mb-egx-bot"
          git config user.email "actions@github.com"
          TYPES="${{ steps.due.outputs.types }}"
          echo "Posting: $TYPES"

          # Phase 1: render every due type's card + caption locally first.
          for TYPE in $TYPES; do
            echo "::group::Rendering $TYPE"
            python social_poster.py render --post-type "$TYPE"
            echo "::endgroup::"
          done

          # Commit + push all rendered images together — they must be live
          # on GitHub (Meta fetches them via raw.githubusercontent.com)
          # before we can publish any of them below.
          git add web_public/social/
          if ! git diff --staged --quiet; then
            git commit -m "Daily social card(s): $TYPES ($(date -u +%F))"
            git pull --rebase --autostash
            git push
          fi

          # Phase 2: publish each due type to both platforms, then mark it
          # posted so it's never re-sent later today.
          for TYPE in $TYPES; do
            IMAGE_URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/web_public/social/latest_${TYPE}.png"

            echo "::group::Publishing $TYPE to Instagram"
            python social_poster.py publish \
              --image-url "$IMAGE_URL" \
              --caption-file "web_public/social/latest_${TYPE}_caption.txt"
            echo "::endgroup::"

            echo "::group::Publishing $TYPE to Facebook Page"
            python social_poster.py publish-fb \
              --image-url "$IMAGE_URL" \
              --caption-file "web_public/social/latest_${TYPE}_caption.txt"
            echo "::endgroup::"

            python post_state.py mark-posted --type "$TYPE"
          done

          git add web_public/social/post_state.json
          if ! git diff --staged --quiet; then
            git commit -m "Mark posted: $TYPES ($(date -u +%F))"
            git pull --rebase --autostash
            git push
          fi

      # Instagram Login tokens expire ~60 days after issue. The publish
      # step above refreshes the token whenever it runs and, if it
      # changed, exposes it as this step's `new_token` output (see
      # social_poster.py's refresh_reminder()). This rotates the
      # IG_ACCESS_TOKEN secret to that new value automatically, so the
      # 60-day expiry never actually becomes your problem — GH_PAT is
      # the one secret that makes this self-service possible, since the
      # default GITHUB_TOKEN isn't allowed to write repository secrets.
      - name: Rotate refreshed token
        if: steps.publish.outputs.new_token != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set IG_ACCESS_TOKEN --body "${{ steps.publish.outputs.new_token }}" --repo "${{ github.repository }}"
          echo "✅ IG_ACCESS_TOKEN secret rotated to the newly refreshed token."
