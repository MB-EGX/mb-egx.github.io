name: Daily Instagram + Facebook Post

# Runs entirely in GitHub's cloud — your PC/desktop app does NOT need to be
# open. It reads the already-published, privacy-scrubbed market_data.json.
#
# HOW THIS WORKS (catch-up model, not fixed-time-or-skip):
#   Six posts — market overview, sectors overview, evening tickers, and
#   track record (each with a fixed Cairo LOCAL due time — see
#   post_state.py: 16:00, 16:20, 19:00, 19:30), plus a 5th "achievement"
#   post that is NOT time-gated: it fires as soon as fresh data shows a
#   Session Pick crossed its horizon's own target gain (see
#   session_picks.py / export_json.py's "session_picks.achieved_today").
#   track_record ALSO has an extra "if present" gate on top of its clock
#   time — it only actually fires once there's at least one entry in
#   "session_picks.achieved_history"; a brand-new account with no
#   achieved picks yet simply never posts an empty track record.
#   The 6th, "weekly", is Friday-only (see post_state.py's
#   WEEKLY_DUE_WEEKDAY / WEEKLY_DUE_TIME = 13:00 Cairo) — a recap of the
#   week that closed Thursday: top 3 gainers, top 3 losers, best/worst
#   sector, and EGX30/EGX70 EWI trend. It's gated on data being recent
#   enough (see WEEKLY_MAX_DATA_AGE_DAYS) rather than dated exactly
#   "today", since Friday itself never has a new session.
#   A run doesn't just fire at a fixed clock time and give up if data
#   isn't ready; EVERY run (whether triggered by a fresh data push, or the
#   periodic safety-net check below) asks post_state.py "which due posts
#   haven't gone out today yet?" and posts them, right then — however late
#   that ends up being. A late CSV feed delays a post, it never loses it.
#
#   Instagram and Facebook are tracked SEPARATELY per post type. If one
#   platform succeeds and the other fails, only the failed one is retried
#   next time — the successful one is never re-posted.
#
# TWO TRIGGERS:
#   1. push — fires the moment publish.py pushes new market_data.json,
#      so a same-day feed usually posts within seconds/minutes.
#   2. schedule (every 15 min, 10:00-19:59 UTC, Sun-Thu) — a safety net,
#      and the actual mechanism that catches a LATE feed (nothing
#      triggers a push-based run again until you next run publish.py, so
#      this periodic check is what notices already-pushed data and posts
#      the overdue slot(s) without you doing anything).
#   The 10:00-19:59 UTC window comfortably covers all 4 Cairo due times
#   (16:00/16:20/19:00/19:30) in both DST offsets (UTC+2 winter / UTC+3
#   summer) — 19:30 Cairo is 16:30 UTC (summer) or 17:30 UTC (winter),
#   both well inside the window.
#   3. schedule (every 15 min, 10:00-13:59 UTC, Friday only) — same
#      safety-net role as #2, but for the "weekly" post specifically.
#      EGX doesn't trade Fri/Sat, so the Sun-Thu window above never runs
#      on a Friday and would never notice "weekly" becoming due. Its
#      fixed due time is 13:00 Cairo local (see post_state.py's
#      WEEKLY_DUE_TIME), which is 11:00 UTC (winter, UTC+2) or 10:00 UTC
#      (summer, UTC+3) — this window covers both with margin.
on:
  push:
    branches: [main]
    paths:
      - 'web_public/data/market_data.json'
  schedule:
    - cron: "*/15 10-19 * * 0-4"
    - cron: "*/15 10-13 * * 5"
  workflow_dispatch:
    inputs:
      post_type:
        description: "Leave as 'auto' for the normal due/not-yet-posted check, or force one specific type right now regardless of due-time/already-posted state"
        required: true
        default: "auto"
        type: choice
        options: [auto, tickers, market, sectors, achievement, track_record, weekly]

permissions:
  contents: write   # needed to commit rendered PNGs + post_state.json back to the repo

# Prevents two runs (e.g. a push-triggered run and the periodic safety-net
# run) from ever executing at the same time. Without this, if a scheduled
# check happens to start just as you push new data, both could render and
# push around the same time — whichever finishes last overwrites the
# other's committed image. cancel-in-progress: false means an overlapping
# trigger queues and runs afterward instead of being dropped.
concurrency:
  group: daily-social-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone — this job's
          # `git pull --rebase` needs to see more than just the single
          # latest commit. (post_state.py's freshness check no longer
          # needs this — it now reads market_data.json's own
          # "last_data_date" field directly instead of git history.)
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pillow

      - name: Determine which post type(s) are due
        id: due
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.post_type }}" != "auto" ]; then
            echo "types=${{ inputs.post_type }}" >> "$GITHUB_OUTPUT"
            echo "Forced manual post: ${{ inputs.post_type }}"
          else
            python post_state.py due
          fi

      - name: Render + commit due card(s)
        if: steps.due.outputs.types != ''
        env:
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
        run: |
          set -e
          git config user.name "mb-egx-bot"
          git config user.email "actions@github.com"
          TYPES="${{ steps.due.outputs.types }}"
          echo "Rendering: $TYPES"

          for TYPE in $TYPES; do
            echo "::group::Rendering $TYPE"
            python social_poster.py render --post-type "$TYPE"
            echo "::endgroup::"
          done

          # N19: refresh the small per-ticker chart tiles (web_public/social/tiles/*.png)
          # alongside the "market" post specifically — that's the one type
          # already tied to the day's overall price move, so this keeps the
          # tiles' cost bounded to once/day instead of once per due-type/run.
          if echo "$TYPES" | grep -qw "market"; then
            echo "::group::Rendering chart tiles (N19)"
            python social_poster.py render --post-type chart_tiles --tile-limit 30
            echo "::endgroup::"
          fi

          # Must be committed + live before we try to publish — Meta
          # fetches these via raw.githubusercontent.com.
          git add web_public/social/
          if ! git diff --staged --quiet; then
            git commit -m "Daily social card(s): $TYPES ($(date -u +%F))"
            git pull --rebase --autostash
            git push
          fi

      - name: Post each due type to Instagram + Facebook
        if: steps.due.outputs.types != ''
        id: publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MBEGX_TELEGRAM_CHANNEL_ID: ${{ secrets.MBEGX_TELEGRAM_CHANNEL_ID }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
        run: |
          # Deliberately NOT set -e here: one platform failing for one
          # type must never stop the other platform, or the other due
          # types, from being attempted. We track failures ourselves and
          # exit 1 at the very end (still fails the job for visibility)
          # without ever skipping remaining work.
          git config user.name "mb-egx-bot"
          git config user.email "actions@github.com"
          TYPES="${{ steps.due.outputs.types }}"
          ANY_FAILED=0
          FIRST_TYPE=1

          for TYPE in $TYPES; do
            # W12: after a downtime catch-up, several post types can go
            # due in the same run. Posting all of them in the same second
            # looks bot-like and can trip Instagram/Facebook's own abuse
            # heuristics. A short stagger between TYPES (not between
            # platforms of the SAME type - that gap is fine) spreads a
            # multi-post catch-up run over a couple of minutes instead.
            if [ "$FIRST_TYPE" -eq 0 ]; then
              echo "Staggering next post type by 45s..."
              sleep 45
            fi
            FIRST_TYPE=0

            IMAGE_URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/web_public/social/latest_${TYPE}.png"

            if python post_state.py needs --type "$TYPE" --platform ig; then
              echo "::group::Publishing $TYPE to Instagram"
              # Instagram-specific caption: link-in-bio nudge instead of
              # raw URLs, since Instagram never makes caption links
              # clickable (unlike Facebook/Telegram, which keep the full
              # URLs via the shared caption file below).
              python social_poster.py publish \
                --image-url "$IMAGE_URL" \
                --caption-file "web_public/social/latest_${TYPE}_caption_ig.txt"
              if [ $? -eq 0 ]; then
                python post_state.py mark-posted --type "$TYPE" --platform ig
              else
                echo "::warning::Instagram publish failed for $TYPE — will retry next run, Facebook still attempted below."
                ANY_FAILED=1
              fi
              echo "::endgroup::"
            fi

            if python post_state.py needs --type "$TYPE" --platform fb; then
              echo "::group::Publishing $TYPE to Facebook Page"
              python social_poster.py publish-fb \
                --image-url "$IMAGE_URL" \
                --caption-file "web_public/social/latest_${TYPE}_caption.txt"
              if [ $? -eq 0 ]; then
                python post_state.py mark-posted --type "$TYPE" --platform fb
              else
                echo "::warning::Facebook publish failed for $TYPE — will retry next run."
                ANY_FAILED=1
              fi
              echo "::endgroup::"
            fi

            # N21: same card, broadcast to the Telegram channel every
            # confirmed subscriber joined at signup. A no-op (skipped, not
            # failed) if MBEGX_TELEGRAM_CHANNEL_ID isn't configured yet.
            if [ -n "$MBEGX_TELEGRAM_CHANNEL_ID" ] && python post_state.py needs --type "$TYPE" --platform tg; then
              echo "::group::Publishing $TYPE to Telegram channel"
              python social_poster.py publish-telegram \
                --image-url "$IMAGE_URL" \
                --caption-file "web_public/social/latest_${TYPE}_caption.txt"
              if [ $? -eq 0 ]; then
                python post_state.py mark-posted --type "$TYPE" --platform tg
              else
                echo "::warning::Telegram publish failed for $TYPE — will retry next run."
                ANY_FAILED=1
              fi
              echo "::endgroup::"
            fi
          done

          git add web_public/social/post_state.json
          if ! git diff --staged --quiet; then
            git commit -m "Mark posted: $TYPES ($(date -u +%F))"
            git pull --rebase --autostash
            git push
          fi

          if [ "$ANY_FAILED" -eq 1 ]; then
            exit 1
          fi

      # Instagram Login tokens expire ~60 days after issue. The publish
      # step above refreshes the token whenever it runs and, if it
      # changed, exposes it as this step's `new_token` output (see
      # social_poster.py's refresh_reminder()). This rotates the
      # IG_ACCESS_TOKEN secret to that new value automatically, so the
      # 60-day expiry never actually becomes your problem — GH_PAT is
      # the one secret that makes this self-service possible, since the
      # default GITHUB_TOKEN isn't allowed to write repository secrets.
      #
      # always() here matters: without it, this step would be silently
      # skipped whenever the publish step above exits 1 (e.g. Facebook
      # failed for one type) — even though Instagram may have refreshed
      # its token just fine in that same run.
      - name: Rotate refreshed token
        if: always() && steps.publish.outputs.new_token != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set IG_ACCESS_TOKEN --body "${{ steps.publish.outputs.new_token }}" --repo "${{ github.repository }}"
          echo "✅ IG_ACCESS_TOKEN secret rotated to the newly refreshed token."
