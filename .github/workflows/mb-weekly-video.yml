# ============================================================
# NEW STANDALONE WORKFLOW — save as .github/workflows/mb-weekly-video.yml
# Runs once a week (default: Friday) instead of daily, and defaults to a
# fully free stack: edge-tts for voice + self-hosted SadTalker for lip-sync.
# Your existing daily-instagram-post.yml (image posts) is untouched.
# ============================================================

name: MB Weekly Arabic Video (Reels)

on:
  schedule:
    - cron: "0 15 * * 5"   # Every Friday ~17:00 Cairo time (UTC+2)
  workflow_dispatch: {}     # lets you trigger a run manually from the Actions tab

jobs:
  mb_weekly_video:
    name: "MB Weekly Arabic Video"
    runs-on: ubuntu-latest
    # Repo variable switch — Settings → Variables → New → MB_VIDEO_ENABLED = true
    if: vars.MB_VIDEO_ENABLED == 'true'
    # SadTalker on a CPU runner is genuinely slow and render speed varies
    # run to run depending on which shared host you land on — observed
    # anywhere from ~1.5 to ~3+ hours for the face-render stage alone.
    # Public repos get unlimited free Actions minutes, so a generous
    # timeout is safe; it just caps worst-case run length. GitHub's hard
    # ceiling for a single job on hosted runners is 360 minutes (6 hours).
    timeout-minutes: 300

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps (free stack)
        run: |
          pip install --quiet requests edge-tts

      # ── Free, self-hosted lip-sync (default path) ────────────────────
      # Skipped entirely if you've set the MB_LIPSYNC_BACKEND repo variable
      # to "heygen" or "did" instead (see the commented secrets below).
      - name: Set up SadTalker (free lip-sync)
        if: vars.MB_LIPSYNC_BACKEND != 'heygen' && vars.MB_LIPSYNC_BACKEND != 'did'
        run: |
          git clone --depth 1 https://github.com/OpenTalker/SadTalker.git
          pip install --quiet -r SadTalker/requirements.txt
          bash SadTalker/scripts/download_models.sh

      # basicsr (a SadTalker dependency, via GFPGAN) still imports
      # torchvision.transforms.functional_tensor, which newer torchvision
      # releases removed. This patches basicsr's own installed copy to use
      # the current import path instead — a known, widely-hit compatibility
      # gap between SadTalker's pinned deps and current torchvision, not
      # anything specific to this repo. Safe to re-run; sed is a no-op once
      # already patched.
      - name: Patch basicsr/torchvision compatibility
        if: vars.MB_LIPSYNC_BACKEND != 'heygen' && vars.MB_LIPSYNC_BACKEND != 'did'
        run: |
          SITE_PACKAGES=$(python3 -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          BASICSR_DEGRADATIONS="$SITE_PACKAGES/basicsr/data/degradations.py"
          if [ -f "$BASICSR_DEGRADATIONS" ]; then
            sed -i 's/from torchvision.transforms.functional_tensor import rgb_to_grayscale/from torchvision.transforms.functional import rgb_to_grayscale/' "$BASICSR_DEGRADATIONS"
            echo "Patched: $BASICSR_DEGRADATIONS"
          else
            echo "basicsr degradations.py not found at $BASICSR_DEGRADATIONS" >&2
            exit 1
          fi

      # SadTalker's animate.py saves the final mp4 via imageio.mimsave(),
      # which hits a known, longstanding imageio bug (imageio/imageio#817)
      # on Python 3.11/3.12: when imageio can't cleanly resolve the mp4
      # write plugin, its own plugin-resolution code calls itself
      # recursively instead of failing cleanly, until Python's recursion
      # limit kills it. This isn't fixable by pinning an imageio version —
      # the bug spans many versions. Instead, this patches animate.py to
      # write the video with OpenCV's VideoWriter (a library SadTalker
      # already depends on and uses elsewhere), which has no such bug and
      # needs no separate ffmpeg plugin resolution. Safe to re-run.
      - name: Patch SadTalker to use OpenCV instead of imageio for mp4 writing
        if: vars.MB_LIPSYNC_BACKEND != 'heygen' && vars.MB_LIPSYNC_BACKEND != 'did'
        run: |
          python3 - <<'PYEOF'
          import re
          import pathlib

          path = pathlib.Path("SadTalker/src/facerender/animate.py")
          text = path.read_text()

          if "_cv2.VideoWriter" in text:
              print("Already patched — skipping.")
          else:
              pattern = re.compile(
                  r"([ \t]*)imageio\.mimsave\(path, result,\s*fps=float\(25\)\)"
              )
              match = pattern.search(text)
              if not match:
                  raise SystemExit(
                      "Could not find the imageio.mimsave(...) call to patch — "
                      "SadTalker's animate.py may have changed. Check its "
                      "contents and update this patch step."
                  )
              indent = match.group(1)
              replacement = (
                  f"{indent}import cv2 as _cv2\n"
                  f"{indent}_h, _w = result[0].shape[:2]\n"
                  f"{indent}_writer = _cv2.VideoWriter(\n"
                  f"{indent}    path, _cv2.VideoWriter_fourcc(*'mp4v'), 25, (_w, _h)\n"
                  f"{indent})\n"
                  f"{indent}for _frame in result:\n"
                  f"{indent}    _writer.write(_cv2.cvtColor(_frame, _cv2.COLOR_RGB2BGR))\n"
                  f"{indent}_writer.release()"
              )
              text = pattern.sub(replacement, text, count=1)
              path.write_text(text)
              print("Patched animate.py to write mp4 via cv2.VideoWriter instead of imageio.mimsave.")
          PYEOF

      - name: Generate MB weekly video & post Reels
        env:
          # ── TTS: free by default, no key needed ─────────────────────
          MB_TTS_ENGINE:        "edge"

          # ── Lip-sync backend: "local" (free, default) | "heygen" | "did" ─
          MB_LIPSYNC_BACKEND:   ${{ vars.MB_LIPSYNC_BACKEND || 'local' }}
          MB_AVATAR_IMAGE_PATH: "assets/mb_reference.png"   # commit this image to the repo

          # ── Only needed if MB_LIPSYNC_BACKEND is 'heygen' or 'did' ───
          HEYGEN_API_KEY:       ${{ secrets.HEYGEN_API_KEY }}
          HEYGEN_AVATAR_ID:     ${{ secrets.HEYGEN_AVATAR_ID }}
          DID_API_KEY:          ${{ secrets.DID_API_KEY }}
          MB_AVATAR_IMAGE_URL:  ${{ secrets.MB_AVATAR_IMAGE_URL }}

          # ── Instagram + Facebook (reuse your existing secrets) ───────
          IG_USER_ID:           ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN:      ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID:           ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}

          # ── GitHub Releases — only used when backend is heygen/did ───
          GH_PAT:               ${{ secrets.GH_PAT }}
          GITHUB_REPO:          ${{ github.repository }}

        run: |
          python mb_generate_video.py --type weekly

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mb-weekly-debug
          path: |
            *.mp3
            *.mp4
          retention-days: 3
