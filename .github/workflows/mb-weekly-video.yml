# ============================================================
# NEW STANDALONE WORKFLOW — save as .github/workflows/mb-weekly-video.yml
# Runs once a week (default: Friday) instead of daily, and defaults to a
# fully free stack: edge-tts for voice + self-hosted SadTalker for lip-sync.
# Your existing daily-instagram-post.yml (image posts) is untouched.
# ============================================================

name: MB Weekly Arabic Video (Reels)

on:
  schedule:
    - cron: "0 15 * * 5"   # Every Friday ~17:00 Cairo time (UTC+2)
  workflow_dispatch: {}     # lets you trigger a run manually from the Actions tab

jobs:
  mb_weekly_video:
    name: "MB Weekly Arabic Video"
    runs-on: ubuntu-latest
    # Repo variable switch — Settings → Variables → New → MB_VIDEO_ENABLED = true
    if: vars.MB_VIDEO_ENABLED == 'true'
    # SadTalker on a CPU runner is genuinely slow — a full render currently
    # takes roughly 2 hours end to end. Public repos get unlimited free
    # Actions minutes, so a generous timeout here is safe; it just caps
    # worst-case run length, it doesn't cost anything extra to set it high.
    # GitHub's hard ceiling for a single job on hosted runners is 360
    # minutes (6 hours).
    timeout-minutes: 240

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps (free stack)
        run: |
          pip install --quiet requests edge-tts

      # ── Free, self-hosted lip-sync (default path) ────────────────────
      # Skipped entirely if you've set the MB_LIPSYNC_BACKEND repo variable
      # to "heygen" or "did" instead (see the commented secrets below).
      - name: Set up SadTalker (free lip-sync)
        if: vars.MB_LIPSYNC_BACKEND != 'heygen' && vars.MB_LIPSYNC_BACKEND != 'did'
        run: |
          git clone --depth 1 https://github.com/OpenTalker/SadTalker.git
          pip install --quiet -r SadTalker/requirements.txt
          # SadTalker's own maintainers pin imageio to this exact version —
          # newer imageio releases changed how they resolve mp4-writing
          # plugins, which crashes SadTalker's animate.py call to
          # imageio.mimsave() with an import error right at the very end of
          # the render (this is also a documented imageio bug specifically
          # on Python 3.11). Installing imageio-ffmpeg alone is NOT enough —
          # imageio itself must be pinned down to a version that still
          # works the way SadTalker expects.
          pip install --quiet "imageio==2.19.3" "imageio-ffmpeg==0.4.7"
          bash SadTalker/scripts/download_models.sh

      # basicsr (a SadTalker dependency, via GFPGAN) still imports
      # torchvision.transforms.functional_tensor, which newer torchvision
      # releases removed. This patches basicsr's own installed copy to use
      # the current import path instead — a known, widely-hit compatibility
      # gap between SadTalker's pinned deps and current torchvision, not
      # anything specific to this repo. Safe to re-run; sed is a no-op once
      # already patched.
      - name: Patch basicsr/torchvision compatibility
        if: vars.MB_LIPSYNC_BACKEND != 'heygen' && vars.MB_LIPSYNC_BACKEND != 'did'
        run: |
          SITE_PACKAGES=$(python3 -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          BASICSR_DEGRADATIONS="$SITE_PACKAGES/basicsr/data/degradations.py"
          if [ -f "$BASICSR_DEGRADATIONS" ]; then
            sed -i 's/from torchvision.transforms.functional_tensor import rgb_to_grayscale/from torchvision.transforms.functional import rgb_to_grayscale/' "$BASICSR_DEGRADATIONS"
            echo "Patched: $BASICSR_DEGRADATIONS"
          else
            echo "basicsr degradations.py not found at $BASICSR_DEGRADATIONS" >&2
            exit 1
          fi

      - name: Generate MB weekly video & post Reels
        env:
          # ── TTS: free by default, no key needed ─────────────────────
          MB_TTS_ENGINE:        "edge"

          # ── Lip-sync backend: "local" (free, default) | "heygen" | "did" ─
          MB_LIPSYNC_BACKEND:   ${{ vars.MB_LIPSYNC_BACKEND || 'local' }}
          MB_AVATAR_IMAGE_PATH: "assets/mb_reference.png"   # commit this image to the repo

          # ── Only needed if MB_LIPSYNC_BACKEND is 'heygen' or 'did' ───
          HEYGEN_API_KEY:       ${{ secrets.HEYGEN_API_KEY }}
          HEYGEN_AVATAR_ID:     ${{ secrets.HEYGEN_AVATAR_ID }}
          DID_API_KEY:          ${{ secrets.DID_API_KEY }}
          MB_AVATAR_IMAGE_URL:  ${{ secrets.MB_AVATAR_IMAGE_URL }}

          # ── Instagram + Facebook (reuse your existing secrets) ───────
          IG_USER_ID:           ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN:      ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID:           ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}

          # ── GitHub Releases — only used when backend is heygen/did ───
          GH_PAT:               ${{ secrets.GH_PAT }}
          GITHUB_REPO:          ${{ github.repository }}

        run: |
          python mb_generate_video.py --type weekly

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mb-weekly-debug
          path: |
            *.mp3
            *.mp4
          retention-days: 3
